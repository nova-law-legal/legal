name: evening-next-day-teams

on:
  # GitHub Actions의 schedule cron은 정시 보장이 안 되어(혼잡 시 수십 분~수 시간 지연)
  # 외부 스케줄러(cron-job.org 등)가 KST 17:30 정시에 workflow_dispatch 로 트리거한다.
  # 설정 방법: docs/외부-스케줄러-설정.md 참고.
  # schedule:
  #   - cron: "30 8 * * *"   # UTC 08:30 == KST 17:30
  workflow_dispatch:      # 외부 스케줄러 + 수동 실행 버튼
    inputs:
      date:
        description: "기준 날짜(YYYY-MM-DD). 지정 시 --next-day 대신 이 날짜 기준으로 발송. 토요일 날짜를 주면 팀 알림은 토·일·월 묶음. (외부 스케줄러는 미지정 → 평소대로 익일)"
        required: false
        default: ""
      only:
        description: "특정 대상만 재발송(이돈호/상담/송무1팀/송무2팀). 미지정 시 전체 발송. 재발송 시에는 자동 점검을 건너뛴다."
        required: false
        default: ""

permissions:
  contents: read
  issues: write   # 자동 점검 경고·실패 보고 이슈 생성용

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send next-day schedule to Discord (이돈호 개인·상담 → 기본 채널, 송무1·2팀 → 팀 채널)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_2: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_2 }}
          GOOGLE_CALENDAR_ID_2: ${{ secrets.GOOGLE_CALENDAR_ID_2 }}
          # 기본 채널 — 이돈호 개인 알림 + 사무실(1006호·404호·인천) 상담 알림
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 팀별 전용 채널 웹훅(없으면 기본 DISCORD_WEBHOOK_URL 로 폴백)
          DISCORD_WEBHOOK_URL_SONGMU1: ${{ secrets.DISCORD_WEBHOOK_URL_SONGMU1 }}
          DISCORD_WEBHOOK_URL_SONGMU2: ${{ secrets.DISCORD_WEBHOOK_URL_SONGMU2 }}
        run: |
          ARGS=(--teams)
          if [ -n "${{ inputs.date }}" ]; then
            ARGS+=(--date "${{ inputs.date }}")
          else
            ARGS+=(--next-day)
          fi
          if [ -n "${{ inputs.only }}" ]; then
            ARGS+=(--only "${{ inputs.only }}")
          fi
          python main.py "${ARGS[@]}"

      # 자동 점검 경고 보고 — 이슈(이력용) + 관리자 메일(통지용, Gmail SMTP).
      # 메일은 GMAIL_APP_PASSWORD 시크릿이 등록된 경우에만 발송된다.
      - name: Report ambiguous-data warnings (issue + mail)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: starlit@novalaw.kr
        run: |
          if [ -s run-warnings.md ]; then
            echo "" >> run-warnings.md
            echo "실행 로그: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> run-warnings.md
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "[자동 점검] $(TZ=Asia/Seoul date +%F) 오후 알림 — 확인 필요 사항" \
              --body-file run-warnings.md || true
            if [ -n "$GMAIL_APP_PASSWORD" ]; then
              python notify_mail.py "[기일알림 점검] $(TZ=Asia/Seoul date +%F) 오후 알림 — 확인 필요 사항" run-warnings.md
            fi
          fi

      # 실행 실패 보고 — 이슈(이력용) + 관리자 메일(통지용)
      - name: Report failure (issue + mail)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: starlit@novalaw.kr
        run: |
          BODY="오후(익일) 알림 발송 실행이 실패했습니다. 실행 로그를 확인해 주세요: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "[발송 실패] $(TZ=Asia/Seoul date +%F) 오후 알림 워크플로" \
            --body "$BODY" || true
          if [ -n "$GMAIL_APP_PASSWORD" ]; then
            echo "$BODY" | python notify_mail.py "[기일알림 실패] $(TZ=Asia/Seoul date +%F) 오후 알림 발송 실패"
          fi
