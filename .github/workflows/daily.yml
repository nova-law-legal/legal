name: daily-schedule-notify

on:
  # GitHub Actions의 schedule cron은 정시 보장이 안 되어(혼잡 시 수십 분~수 시간 지연)
  # 외부 스케줄러(cron-job.org 등)가 KST 07:00 정시에 workflow_dispatch 로 트리거한다.
  # 설정 방법: docs/외부-스케줄러-설정.md 참고.
  # 아래 schedule 은 외부 트리거가 실패했을 때를 대비한 '지연 가능 백업'으로 남겨두되,
  # 중복 발송이 우려되면 주석 처리한다. (현재: 외부 트리거 단독 운영을 위해 비활성화)
  # schedule:
  #   - cron: "0 22 * * *"   # UTC 22:00 == KST 07:00 (한국은 서머타임 없음)
  workflow_dispatch: {}   # 외부 스케줄러 + 수동 실행 버튼

permissions:
  contents: read
  issues: write   # 자동 점검 경고·실패 보고 이슈 생성용

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily schedule to Discord
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          # 두 번째 구글 계정(캘린더 3개)
          GOOGLE_SERVICE_ACCOUNT_JSON_2: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_2 }}
          GOOGLE_CALENDAR_ID_2: ${{ secrets.GOOGLE_CALENDAR_ID_2 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 팀별 전용 채널 웹훅 — 오전 팀 알림(팀 일정을 한 통에 모아 발송)용.
          # 미설정 시 그 팀의 오전 알림은 건너뛴다(기본 채널 전체 알림과 중복 방지).
          DISCORD_WEBHOOK_URL_SONGMU1: ${{ secrets.DISCORD_WEBHOOK_URL_SONGMU1 }}
          DISCORD_WEBHOOK_URL_SONGMU2: ${{ secrets.DISCORD_WEBHOOK_URL_SONGMU2 }}
        run: python main.py

      # 자동 점검 경고 보고 — 이슈(이력용) + 관리자 메일(통지용, Gmail SMTP).
      # 메일은 GMAIL_APP_PASSWORD 시크릿이 등록된 경우에만 발송된다.
      - name: Report ambiguous-data warnings (issue + mail)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: starlit@novalaw.kr
        run: |
          if [ -s run-warnings.md ]; then
            echo "" >> run-warnings.md
            echo "실행 로그: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> run-warnings.md
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "[자동 점검] $(TZ=Asia/Seoul date +%F) 오전 알림 — 확인 필요 사항" \
              --body-file run-warnings.md || true
            if [ -n "$GMAIL_APP_PASSWORD" ]; then
              python notify_mail.py "[기일알림 점검] $(TZ=Asia/Seoul date +%F) 오전 알림 — 확인 필요 사항" run-warnings.md
            fi
          fi

      # 실행 실패 보고 — 이슈(이력용) + 관리자 메일(통지용)
      - name: Report failure (issue + mail)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: starlit@novalaw.kr
        run: |
          BODY="오전 알림 발송 실행이 실패했습니다. 실행 로그를 확인해 주세요: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "[발송 실패] $(TZ=Asia/Seoul date +%F) 오전 알림 워크플로" \
            --body "$BODY" || true
          if [ -n "$GMAIL_APP_PASSWORD" ]; then
            echo "$BODY" | python notify_mail.py "[기일알림 실패] $(TZ=Asia/Seoul date +%F) 오전 알림 발송 실패"
          fi
