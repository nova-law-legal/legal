# 변호사별 디스코드 멘션 설정 — 오후(익일) 알림의 '@변호사' 멘션에 사용
#
# ★ id 를 채워야 '진짜 알림(핑)'이 갑니다 ★
#   웹훅 메시지에 '@계정명'을 글자로 적으면 디스코드는 알림을 보내지 않는다.
#   실제 핑은 '<@사용자ID>' 형식만 동작하므로, 아래 id 칸에 각 계정의
#   디스코드 사용자 ID(숫자)를 채우면 그때부터 진짜 멘션으로 발송된다.
#   (id 가 비어 있는 동안은 '@계정명' 텍스트로만 표시 — 핑 없음)
#
#   ID 확인법: 디스코드 설정 > 고급 > 개발자 모드 켜기
#              → 서버 멤버 목록에서 대상 우클릭 → "사용자 ID 복사하기"
#
# 계정명: 디스코드 계정명. 기본은 이름 그대로이고,
#         이돈호·천기섭·신이나·임현진은 뒤에 ' 변호사'가 붙은 계정명을 쓴다.
# 인사이동·계정 변경 시 이 파일만 고치면 반영된다.

이돈호: {계정명: 이돈호 변호사, id: }

# ── 송무1팀 ──
