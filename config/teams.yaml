# 팀별 변호사 명단 — 오후(익일) 팀별 알림 분류 기준
#
# (v1.13.0 팀 개편) 담당직원 태그(#송무n팀)는 Lawware에서 삭제 예정이라 더 이상
# 송무팀 분류에 쓰지 않는다. 일정이 어느 팀 알림에 실릴지는 아래 명단으로 정한다.
#
# 변호사: 정변호사. 일정의 담당변호사(정식 기일) / 담당(변호사)(그 외 일정)에
#         이 명단의 이름이 있으면 그 팀 알림에 포함(1차 기준).
#         서로 다른 팀 변호사가 함께 담당이면 양쪽 팀 모두에 알림.
#         또한 출석변호사가 이 명단에 있으면 다른 팀 사건도 팔로우(교차출석).
# 수습:   수습변호사. 담당변호사 중 정변호사가 '하나도 없을 때만' 팀 판정에
#         사용(2차 폴백). 직접 출석하지 않으므로 교차출석 팔로우에는 쓰지 않는다.
# 태그:   true 면 담당직원 필드의 팀 태그(#상담지원팀)로도 매칭.
#
# 인사이동 시 이 파일만 고치면 전체에 반영된다.

송무1팀:
  변호사: [천기섭, 박정윤, 박준호, 김정아, 이종원]
  수습: [신이나, 정희소, 이하영, 정진실]
송무2팀:
  변호사: [김태환, 채원협, 김수인]
  수습: [임현진, 김윤수, 박건우, 한충호]
# 상담지원팀: #상담지원팀 태그가 있거나, 이돈호 변호사가 담당/출석하는 일정.
#             (김태환은 송무2팀 기준으로만 분류. 여러 팀 중복 노출은 의도된 동작)
상담지원팀:
  변호사: [이돈호]
  태그: true
