# 변호사별 담당직원 명단 — 오후(익일) 팀별 알림의 변호사별 [휴무] 칸 배정 기준
#
# 팀별 알림은 변호사마다 '# ○○ 변호사' 섹션으로 나뉘고, 각 섹션의 [휴무] 에는
#   ① 변호사 본인의 휴무(휴가·반차·연차 등)
#   ② 아래 명단에 적힌 담당직원의 휴무
# 를 함께 싣는다. 한 직원이 여러 변호사의 담당이면 그 변호사들 섹션에 모두 실린다.
#
# 판정은 휴무 일정 '제목'의 이름으로 한다(예: '임지혜 연차' → 임지혜 담당 변호사들).
# 주담당/부담당 구분은 사람이 읽기 위한 것이고, 알림에는 둘 다 똑같이 실린다.
#
# 인사이동 시 이 파일만 고치면 전체에 반영된다. (팀 소속은 teams.yaml)
# 2026-09-04 인사이동: 박성하 입사(2팀)·박민웅 입사(2팀 직원)·강재철 상담지원팀→2팀,
#   김정아 1팀→2팀, 한충호 2팀→1팀, 김유빈 퇴사.

# ── 송무1팀 ──
천기섭: {주담당: 임지혜, 부담당: 최수빈}
박정윤: {주담당: 최수빈, 부담당: 임지혜}
박준호: {주담당: 우서영, 부담당: 진정은}
이종원: {주담당: 최수빈, 부담당: 임지혜}
신이나: {주담당: 진정은, 부담당: 우서영}
정희소: {주담당: 임지혜, 부담당: 최수빈}
이하영: {주담당: 진정은, 부담당: 우서영}
정진실: {주담당: 임지혜, 부담당: 최수빈}
한충호: {주담당: 우서영}          # 임시 배정 — 부담당은 추후 신규입사자로 대체 예정

# ── 송무2팀 ──
김태환: {주담당: 민은선, 부담당: 김영은}
채원협: {주담당: 최성혜, 부담당: 유은진}
김수인: {주담당: 김영은, 부담당: 박민웅}
김정아: {주담당: 김영은, 부담당: 박민웅}
박성하: {주담당: 최성혜, 부담당: 박민웅}
김윤수: {주담당: 유은진, 부담당: 강재철}
임현진: {주담당: 유은진, 부담당: 강재철}
박건우: {주담당: 유은진, 부담당: 강재철}

# ── 대표변호사(상담지원팀) ──
# 주/부 구분 없이 이 사람들의 휴무를 이돈호 변호사 섹션에 싣는다.
이돈호:
  담당직원: [조준혁, 윤태지, 김진우, 유가실, 이영은, 윤태린, 오바다]
